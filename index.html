<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomberman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Bomberman Oyunu</h1>
        
        <!-- Giriş Ekranı -->
        <div id="welcome-screen">
            <h2>Oyuna Başla</h2>
            <input type="text" id="nickname-input" placeholder="Takma Adını Gir" maxlength="20">
            <button id="start-game-btn">Bomberman Oyna</button>
        </div>
        
        <!-- İzleyici Arayüzü -->
        <div id="spectator-ui" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.8); padding: 30px; border-radius: 15px; z-index: 20;">
            <h2 style="color: red; margin-top: 0;">GAME OVER - İzleyici Modu</h2>
            <button id="restart-btn">Yeniden Başlat (0/1)</button>
        </div>
        
        <!-- Oyun Alanı -->
        <canvas id="game-canvas" style="display: none;"></canvas>
        <!-- YENİ: Mobil Kontroller (Varsayılan olarak gizli) -->
        <div id="mobile-controls">
            <div id="d-pad">
                <button id="btn-up" class="control-btn">⬆️</button>
                <div class="horizontal-btns">
                    <button id="btn-left" class="control-btn">⬅️</button>
                    <button id="btn-right" class="control-btn">➡️</button>
                </div>
                <button id="btn-down" class="control-btn">⬇️</button>
            </div>
            <div id="action-pad">
                <button id="btn-bomb" class="control-btn action-btn">💣</button>
            </div>
        </div>
        
        <div id="instructions">
            <p>Yön tuşları ile hareket et, boşluk tuşu ile bomba koy</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
