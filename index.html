<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karacete Oyunlar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Karacete Oyunlar</h1>

        <!-- Lobi -->
        <div id="welcome-screen">
            <h2>Oyuna Başla</h2>
            <input type="text" id="nickname-input" placeholder="Takma Adını Gir" maxlength="20" autocomplete="off">
            <div id="game-cards" role="radiogroup" aria-label="Oyun seç"></div>
            <button id="create-room-btn" class="lobby-btn primary">Oda Kur</button>
            <div class="lobby-divider">ya da</div>
            <input type="text" id="room-code-input" placeholder="Oda Kodu" maxlength="6" autocomplete="off">
            <button id="join-room-btn" class="lobby-btn secondary">Oda Koduna Katıl</button>
            <p id="lobby-error" role="alert"></p>
        </div>

        <!-- Oda çubuğu (odadayken görünür) -->
        <div id="room-bar">
            <span>Oda: <strong id="room-code"></strong></span>
            <button id="copy-code-btn" class="bar-btn">Kodu Kopyala</button>
            <button id="share-link-btn" class="bar-btn">Bağlantıyı Paylaş</button>
            <button id="leave-room-btn" class="bar-btn danger">Odadan Çık</button>
        </div>

        <!-- Seçilen oyun kendi arayüzünü buraya kurar -->
        <div id="game-root"></div>
    </div>

    <script src="config.js"></script>
    <script src="core/games.js"></script>
    <script src="core/connection.js"></script>
    <script src="core/lobby.js"></script>
    <script src="core/duel.js"></script>
    <script src="core/duel-ui.js"></script>
    <script src="games/bomberman-joystick.js"></script>
    <script src="games/bomberman.js"></script>
    <script src="games/xox-rules.js"></script>
    <script src="games/xox.js"></script>
    <script src="games/connect4-rules.js"></script>
    <script src="games/connect4.js"></script>
    <script src="games/catdog-rules.js"></script>
    <script src="games/catdog.js"></script>
    <script src="games/kafatopu-rules.js"></script>
    <script src="games/kafatopu-predict.js"></script>
    <script src="games/kafatopu-net.js"></script>
    <script src="games/kafatopu.js"></script>
    <script src="games/parti/config.js"></script>
    <script src="games/parti/graph.js"></script>
    <script src="games/parti/maps/pirate.js"></script>
    <script src="games/parti/maps/space.js"></script>
    <script src="games/parti/rules.js"></script>
    <script src="games/parti/mini/duel-referee.js"></script>
    <script src="games/parti/mini/duel-adapter.js"></script>
    <script src="games/parti/minigame.js"></script>
    <script src="games/parti/machine.js"></script>
    <script src="games/parti/ticker.js"></script>
    <script src="games/parti/ui.js"></script>
    <script src="core/main.js"></script>
</body>
</html>
