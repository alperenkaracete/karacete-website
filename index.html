<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomberman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Bomberman Oyunu</h1>
        
        <!-- Giriş Ekranı -->
        <div id="welcome-screen">
            <h2>Oyuna Başla</h2>
            <input type="text" id="nickname-input" placeholder="Takma Adını Gir" maxlength="20">
            <button id="start-game-btn">Bomberman Oyna</button>
        </div>
        
        <!-- İzleyici Arayüzü -->
        <div id="spectator-ui" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.8); padding: 30px; border-radius: 15px; z-index: 20;">
            <h2 style="color: red; margin-top: 0;">GAME OVER - İzleyici Modu</h2>
            <button id="restart-btn">Yeniden Başlat (0/1)</button>
        </div>
        
        <!-- Oyun Alanı -->
        <canvas id="game-canvas" style="display: none;"></canvas>
        
        <!-- Mobil Kontroller -->
        <div id="mobile-controls">
            <!-- ÇEKMELİ JOYSTICK -->
            <div id="joystick-zone">
                <div id="joystick-base">
                    <div id="joystick-knob"></div>
                </div>
            </div>
            
            <div id="action-pad">
                <button id="btn-bomb" class="control-btn action-btn">💣</button>
            </div>
        </div>
        
    </div> <!-- game-container kapanışı eklendi -->

    <!-- İŞTE EKSİK OLAN VE OYUNU ÇALIŞTIRACAK HAYATİ SATIR -->
    <!-- Eğer JS dosyanızın adı game_3.js ise burayı ona göre değiştirin -->
    <script src="game.js"></script> 
</body>
</html>
